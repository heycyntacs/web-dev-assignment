services:
  postgres_db:
    image: postgres:16-alpine
    hostname: postgres_db
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prisma
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - prisma-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 2s
      retries: 20

  server:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    stdin_open: true
    tty: true # Keeps the container running for debugging
    environment:
      DATABASE_URL: postgresql://postgres:prisma@postgres_db:5432/postgres?schema=public
      NODE_ENV: development
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-development}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - prisma-network
    volumes:
      - ./backend:/usr/src/app
      - /usr/src/app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    stdin_open: true
    tty: true # Keeps the container running for debugging
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - server
    networks:
      - prisma-network
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  postgres_data_dev:
    driver: local

networks:
  prisma-network:
    name: prisma-network
