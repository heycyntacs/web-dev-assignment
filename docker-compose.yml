services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: web-dev-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    # Optional: uncomment if you have a .env file
    # env_file:
    #   - ./backend/.env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - web-dev-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-dev-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost/",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - web-dev-network

networks:
  web-dev-network:
    driver: bridge
